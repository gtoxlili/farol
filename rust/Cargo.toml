[workspace]
resolver = "3"
members = ["gsp_sys", "logic", "platform", "host", "xtask"]
# `cargo test` here runs the logic tests on the build host. `platform` builds only
# for the board (from the IDF build); `host` builds from the simulator backend's CMake.
default-members = ["logic", "xtask"]

[workspace.package]
edition = "2024"
version = "1.0.0"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
gsp_sys = { path = "gsp_sys" }
logic = { path = "logic" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.dev]
panic = "abort"
opt-level = 1

