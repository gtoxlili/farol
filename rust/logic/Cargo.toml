[package]
name = "logic"
description = "Farol's logic: Paseo client session, farol/1 model, navigation and the GSP setters (GSP renders, this crate decides)"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false
bench = false

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false }
gsp_sys.workspace = true
hmac = { version = "0.13.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.1", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false }
